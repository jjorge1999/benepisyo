name: Deploy to Cloudflare (manual)

# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# The first run creates the D1 database, loads the seed benefits, deploys the API,
# creates the Pages project "benepisyo" and publishes the site.

# Manual for now: the live site is on GitHub Pages (see pages.yml).
on:
  workflow_dispatch:
  repository_dispatch:
    types: [content-published]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test site/test/match.test.js site/test/i18n.test.js
      - run: npm ci && npm test
        working-directory: worker

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: benepisyo
      SITE_URL: https://benepisyo.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - run: npm ci
        working-directory: worker

      - name: Create or find the D1 database
        working-directory: worker
        run: |
          ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==='benepisyo');process.stdout.write(d?d.uuid:'')})")
          if [ -z "$ID" ]; then
            npx wrangler d1 create benepisyo
            ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s);process.stdout.write(l.find(x=>x.name==='benepisyo').uuid)})")
          fi
          echo "D1 database id: $ID"
          sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$ID/" wrangler.toml

      - name: Apply schema and seed benefits (existing rows are kept)
        working-directory: worker
        run: |
          npx wrangler d1 execute benepisyo --remote --file=schema.sql -y
          node scripts/seed-sql.mjs > seed.sql
          npx wrangler d1 execute benepisyo --remote --file=seed.sql -y

      - name: Deploy API worker
        id: api
        working-directory: worker
        run: |
          npx wrangler deploy --var "SITE_ORIGIN:$SITE_URL" | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "API URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build site from published content
        working-directory: site
        run: npm ci && npm run build
        env:
          SITE_URL: https://${{ env.PAGES_PROJECT }}.pages.dev
          API_BASE: ${{ steps.api.outputs.url }}
          BENEFITS_URL: ${{ steps.api.outputs.url }}/api/public/benefits

      - name: Create the Pages project if needed
        working-directory: worker
        run: npx wrangler pages project create "$PAGES_PROJECT" --production-branch=main || echo "Pages project already exists"

      - name: Deploy site to Cloudflare Pages
        working-directory: worker
        run: npx wrangler pages deploy ../site/dist/browser --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true
