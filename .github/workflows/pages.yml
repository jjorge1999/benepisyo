name: Test and publish to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Test eligibility logic, translations and data
        run: node --test site/test/match.test.js site/test/i18n.test.js
      - name: Test API
        working-directory: worker
        run: npm ci && npm test
      - name: Install site dependencies (Angular, ng-zorro-antd)
        working-directory: site
        run: npm ci
      - name: Build site (pre-render every page)
        working-directory: site
        run: npm run build -- --base-href /${{ github.event.repository.name }}/
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          API_BASE: ${{ vars.API_BASE }}
      - name: Publish to the gh-pages branch
        if: github.event_name != 'pull_request'
        working-directory: site/dist/browser
        run: |
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Publish site from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
